<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — הדף לא נמצא | KesherOS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <style>
    @font-face { font-family: 'Heebo'; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fonts/heebo-hebrew.woff2) format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
    @font-face { font-family: 'Heebo'; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fonts/heebo-latin.woff2) format('woff2'); unicode-range: U+0000-024F; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #0E2340; --gold: #C4922A; --text-on-dark: #E8EEF8; --text-muted: #8ea3c4; }
    body {
      font-family: 'Heebo', system-ui, sans-serif;
      background: var(--navy);
      color: var(--text-on-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .error-page { max-width: 480px; }
    .error-code {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 12px;
      opacity: 0.85;
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--text-muted); font-size: 1rem; line-height: 1.7; margin-bottom: 32px; }
    .btn-home {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      padding: 14px 36px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-home:hover { background: #E5B44A; }
    .logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      margin-top: 48px;
      opacity: 0.4;
    }
    .logo-os { color: var(--gold); }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-code">404</div>
    <h1>הדף שחיפשתם לא נמצא</h1>
    <p>ייתכן שהכתובת השתנתה, או שהדף כבר לא קיים. אין מה לדאוג — חזרו לדף הראשי וממשיכו משם.</p>
    <a href="/" class="btn-home">חזרה לדף הראשי ←</a>
    <div class="logo">Kesher<span class="logo-os">OS</span></div>
  </div>
</body>
</html>
